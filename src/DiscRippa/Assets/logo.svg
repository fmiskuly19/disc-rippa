<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="110"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6efff"/><stop offset="0.45" stop-color="#5cb8f5"/><stop offset="1" stop-color="#1f7fe0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22b8e6"/><stop offset="1" stop-color="#0650a8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#b07446"/><stop offset="0.7" stop-color="#7b4524"/><stop offset="1" stop-color="#4f2a12"/>
    </radialGradient>
    <radialGradient id="cream" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e9cfa8"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.2" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e3f1fb"/><stop offset="1" stop-color="#a9c4dc"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5dffc8" stop-opacity="0.7"/><stop offset="0.3" stop-color="#5fb8ff" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#c58bff" stop-opacity="0.6"/><stop offset="0.8" stop-color="#ffe95c" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#5dffc8" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.05"/><stop offset="0.92" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#2c7a24"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#00264d" flood-opacity="0.35"/>
    </filter>
    <filter id="discshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#003366" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="hillback" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6e36a"/><stop offset="1" stop-color="#4fa83a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd65a"/><stop offset="0.45" stop-color="#37892b"/><stop offset="1" stop-color="#1f5e1c"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe3ff"/><stop offset="0.5" stop-color="#2aa6ec"/><stop offset="1" stop-color="#0a5fb0"/>
    </linearGradient>
    <radialGradient id="cloud" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6f4ff"/>
    </radialGradient>
  </defs>

  <g filter="url(#shadow)">
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="400" cy="100" r="120" fill="url(#sun)"/>
    <path d="M-20 300 C 90 230, 210 250, 300 280 C 380 305, 460 240, 540 255 L540 540 L-20 540 Z" fill="url(#hillback)"/>
    <path d="M-20 335 C 100 300, 200 330, 300 320 C 400 310, 470 300, 540 312 L540 540 L-20 540 Z" fill="url(#hill)"/>
    <path d="M-20 430 C 120 400, 360 420, 540 395 L540 540 L-20 540 Z" fill="url(#hill)"/>
    <path d="M-20 430 C 120 400, 360 420, 540 395" fill="none" stroke="#c8f59a" stroke-width="3" opacity="0.7"/>

    <g transform="translate(256 34) scale(1.28) translate(-256 -108)">
    <!-- otter head, peeking over the disc -->
    <ellipse cx="160" cy="168" rx="24" ry="22" fill="#5b3015"/>
    <ellipse cx="352" cy="168" rx="24" ry="22" fill="#5b3015"/>
    <ellipse cx="160" cy="170" rx="11" ry="10" fill="#c99668"/>
    <ellipse cx="352" cy="170" rx="11" ry="10" fill="#c99668"/>
    <ellipse cx="256" cy="200" rx="112" ry="92" fill="url(#fur)"/>
    <!-- pale face -->
    <path d="M168 230 C 170 190, 210 170, 256 170 C 302 170, 342 190, 344 230 C 340 270, 300 290, 256 290 C 212 290, 172 270, 168 230 Z" fill="url(#cream)"/>
    <!-- eyes -->
    <circle cx="210" cy="190" r="12" fill="#1f0f05"/><circle cx="214" cy="186" r="4" fill="#fff"/>
    <circle cx="302" cy="190" r="12" fill="#1f0f05"/><circle cx="306" cy="186" r="4" fill="#fff"/>
    <!-- whisker pads -->
    <circle cx="236" cy="236" r="26" fill="#fffdf8"/>
    <circle cx="276" cy="236" r="26" fill="#fffdf8"/>
    <g fill="#c9a77a"><circle cx="226" cy="232" r="2.5"/><circle cx="238" cy="244" r="2.5"/><circle cx="222" cy="246" r="2.5"/>
      <circle cx="286" cy="232" r="2.5"/><circle cx="274" cy="244" r="2.5"/><circle cx="290" cy="246" r="2.5"/></g>
    <!-- nose -->
    <path d="M234 206 C 234 198, 278 198, 278 206 C 278 218, 262 226, 256 226 C 250 226, 234 218, 234 206 Z" fill="#2a1408"/>
    <ellipse cx="248" cy="205" rx="7" ry="3" fill="#fff" opacity="0.6"/>
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <path d="M212 236 l -46 -6"/><path d="M212 244 l -44 8"/><path d="M300 236 l 46 -6"/><path d="M300 244 l 44 8"/>
    </g>
    <!-- fur shine -->
    <ellipse cx="236" cy="132" rx="46" ry="12" fill="#fff" opacity="0.28" transform="rotate(-8 236 132)"/>

    <!-- the disc -->
    <g transform="translate(256 372) scale(0.93)" filter="url(#discshadow)">
      <circle r="128" fill="url(#disc)" stroke="#ffffff" stroke-width="5"/>
      <circle r="128" fill="url(#iris)"/>
      <circle r="122" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2"/>
      <circle r="44" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="3"/>
      <circle r="32" fill="#e3f6ff" stroke="#8fc7e6" stroke-width="2"/>
      <circle r="16" fill="#2aa6ec"/><circle r="16" fill="none" stroke="#fff" stroke-width="2.5"/>
      <path d="M-100 -70 A 122 122 0 0 1 40 -116 L 30 -82 A 86 86 0 0 0 -70 -48 Z" fill="#fff" opacity="0.75"/>
    </g>
    <!-- paws gripping the rim -->
    <g fill="#5b3015">
      <ellipse cx="184" cy="268" rx="30" ry="22"/><ellipse cx="328" cy="268" rx="30" ry="22"/>
    </g>
    <g stroke="#3a1c0a" stroke-width="3" stroke-linecap="round">
      <path d="M172 252 v14"/><path d="M186 250 v14"/><path d="M200 254 v12"/>
      <path d="M312 254 v12"/><path d="M326 250 v14"/><path d="M340 252 v14"/>
    </g>
    <ellipse cx="180" cy="260" rx="14" ry="5" fill="#fff" opacity="0.25"/>
    <ellipse cx="324" cy="260" rx="14" ry="5" fill="#fff" opacity="0.25"/>

    </g>


    <path d="M16 16 H496 V170 C 380 215, 160 130, 16 200 Z" fill="url(#gloss)" opacity="0.5"/>
  </g>
  <rect x="18" y="18" width="476" height="476" rx="108" fill="none" stroke="url(#rim)" stroke-width="4" opacity="0.9"/>
  </g>
</svg>
