name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DiscRippa.Tests/DiscRippa.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish src/DiscRippa/DiscRippa.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DiscRippa
          path: publish/DiscRippa.exe
